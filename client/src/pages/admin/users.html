<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen User - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Component -->
        <div id="adminSidebar"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <h1 class="page-title">
                    <i class="fas fa-users-cog"></i> Manajemen User
                </h1>
            </header>

            <!-- CRUD Container -->
            <div class="crud-container">
                <!-- Create/Update Form -->
                <section class="form-section" id="formSection">
                    <h3>
                        <i class="fas fa-user-edit"></i>
                        <span id="formTitle">Tambah User Baru</span>
                    </h3>
                    <form id="userForm">
                        <input type="hidden" id="userId" name="id">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="name">Nama Lengkap *</label>
                                <input type="text" id="name" name="name" required placeholder="Masukkan nama lengkap">
                            </div>
                            <div class="form-group">
                                <label for="email">Email *</label>
                                <input type="email" id="email" name="email" required placeholder="contoh@email.com">
                            </div>
                            <div class="form-group">
                                <label for="password">Password *</label>
                                <input type="password" id="password" name="password" placeholder="Biarkan kosong jika tidak ingin mengganti">
                                <small>Minimal 6 karakter</small>
                            </div>
                            <div class="form-group">
                                <label for="role">Role *</label>
                                <select id="role" name="role" required>
                                    <option value="">Pilih Role</option>
                                    <option value="admin">Admin</option>
                                    <option value="member">Member</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="phone">Telepon</label>
                                <input type="tel" id="phone" name="phone" placeholder="0812-3456-7890">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn" id="cancelBtn">
                                <i class="fas fa-times"></i> Batal
                            </button>
                            <button type="submit" class="btn btn-primary" id="submitBtn">
                                <i class="fas fa-save"></i> Simpan
                            </button>
                        </div>
                    </form>
                </section>

                <!-- Users Table -->
                <section class="table-section">
                    <div class="table-header">
                        <h3><i class="fas fa-list"></i> Daftar User</h3>
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" placeholder="Cari user...">
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table id="usersTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nama</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Telepon</th>
                                    <th>Dibuat</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <!-- Data akan diisi oleh JavaScript -->
                                <tr>
                                    <td colspan="7" class="loading">
                                        <div class="spinner"></div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modal Detail User -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">
                    <i class="fas fa-user-circle"></i> Detail User
                </h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div id="userDetailContent">
                <!-- Detail user akan diisi oleh JavaScript -->
            </div>
        </div>
    </div>
</body>
</html>
