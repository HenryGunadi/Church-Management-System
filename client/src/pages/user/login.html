<section>
  <div class="container">
    <!-- Left Image / Info Section -->
    <div class="image-section">
      <div class="image-content">
        <a href="/" class="logo">✟</a>
        <h1>Welcome Back</h1>
        <p>
          Sign in to access your church community portal, stay connected with
          upcoming events, and engage with our faith family.
        </p>
      </div>
    </div>

    <!-- Login Form Section -->
    <div class="form-section">
      <div class="form-header">
        <h2>Sign In</h2>
        <p>Enter your credentials to continue</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="your.email@example.com"
            required
          />
          <div class="error-message" id="emailError"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />
          <div class="error-message" id="passwordError"></div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" name="rememberMe" />
            <span>Remember me</span>
          </label>

          <!-- SPA-safe placeholder -->
          <a href="#" class="forgot-password" onclick="event.preventDefault()">
            Forgot password?
          </a>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>

        <div class="register-link">
          Don't have an account?
          <a href="/register">Create one</a>
        </div>
      </form>
    </div>
  </div>
</section>
