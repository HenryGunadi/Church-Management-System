<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join Our Community - Church Registration</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: #f8f8f8;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 1200px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: white;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }

      .image-section {
        background: linear-gradient(
            135deg,
            rgba(26, 26, 26, 0.85),
            rgba(26, 26, 26, 0.75)
          ),
          url("https://images.unsplash.com/photo-1438032005730-c779502df39b?w=800")
            center/cover;
        padding: 60px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
      }

      .image-section::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(
          circle at 30% 50%,
          rgba(255, 107, 0, 0.15),
          transparent
        );
      }

      .image-content {
        position: relative;
        z-index: 1;
        color: white;
      }

      .logo {
        width: 60px;
        height: 60px;
        background: #ff6b00;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 40px;
        font-size: 28px;
        color: white;
      }

      .image-content h1 {
        font-family: "Playfair Display", serif;
        font-size: 48px;
        font-weight: 700;
        margin-bottom: 20px;
        line-height: 1.2;
      }

      .image-content p {
        font-size: 18px;
        line-height: 1.6;
        opacity: 0.95;
      }

      .form-section {
        padding: 60px;
        background: white;
      }

      .form-header {
        margin-bottom: 40px;
      }

      .form-header h2 {
        font-family: "Playfair Display", serif;
        font-size: 32px;
        color: #1a1a1a;
        margin-bottom: 8px;
      }

      .form-header p {
        color: #666;
        font-size: 15px;
      }

      .form-group {
        margin-bottom: 24px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #1a1a1a;
        font-weight: 500;
        font-size: 14px;
      }

      .input-wrapper {
        position: relative;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e5e5e5;
        border-radius: 12px;
        font-size: 15px;
        transition: all 0.3s ease;
        font-family: "Inter", sans-serif;
      }

      input[type="password"],
      input[type="text"] {
        padding-right: 48px;
      }

      input:focus {
        outline: none;
        border-color: #ff6b00;
        box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.1);
      }

      input.error {
        border-color: #dc2626;
      }

      .eye-toggle {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        color: #666;
        font-size: 20px;
        line-height: 1;
        transition: color 0.2s ease;
      }

      .eye-toggle:hover {
        color: #ff6b00;
      }

      .eye-toggle:focus {
        outline: none;
      }

      .error-message {
        color: #dc2626;
        font-size: 13px;
        margin-top: 6px;
        display: none;
      }

      .error-message.show {
        display: block;
      }

      .submit-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #ff6b00, #ff8c00);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 8px;
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(255, 107, 0, 0.3);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .login-link {
        text-align: center;
        margin-top: 24px;
        color: #666;
        font-size: 14px;
      }

      .login-link a {
        color: #ff6b00;
        text-decoration: none;
        font-weight: 600;
      }

      .login-link a:hover {
        text-decoration: underline;
      }

      .password-strength {
        height: 4px;
        background: #e5e5e5;
        border-radius: 2px;
        margin-top: 8px;
        overflow: hidden;
      }

      .password-strength-bar {
        height: 100%;
        width: 0;
        transition: all 0.3s ease;
        border-radius: 2px;
      }

      .strength-weak {
        background: #dc2626;
        width: 33%;
      }
      .strength-medium {
        background: #ff8c00;
        width: 66%;
      }
      .strength-strong {
        background: #16a34a;
        width: 100%;
      }

      @media (max-width: 968px) {
        .container {
          grid-template-columns: 1fr;
        }

        .image-section {
          padding: 40px;
          min-height: 300px;
        }

        .image-content h1 {
          font-size: 36px;
        }

        .form-section {
          padding: 40px 30px;
        }
      }

      @media (max-width: 480px) {
        .form-section {
          padding: 30px 20px;
        }

        .image-section {
          padding: 30px 20px;
        }

        .image-content h1 {
          font-size: 28px;
        }
      }
    </style>
    <link rel="stylesheet" href="../../css/alert.css" />
  </head>
  <body>
    <div class="container">
      <div class="image-section">
        <div class="image-content">
          <div class="logo">✟</div>
          <h1>Welcome to Our Faith Community</h1>
          <p>
            Join us in worship, fellowship, and spiritual growth. Create your
            account to connect with our church family and stay updated with
            events and services.
          </p>
        </div>
      </div>

      <div class="form-section">
        <div class="form-header">
          <h2>Create Account</h2>
          <p>Fill in your details to get started</p>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="your.email@example.com"
              required
            />
            <div class="error-message" id="emailError"></div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a strong password"
                required
              />
              <button type="button" class="eye-toggle" id="togglePassword">
                👁️
              </button>
            </div>
            <div class="password-strength">
              <div class="password-strength-bar" id="strengthBar"></div>
            </div>
            <div class="error-message" id="passwordError"></div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Re-enter your password"
                required
              />
              <button
                type="button"
                class="eye-toggle"
                id="toggleConfirmPassword"
              >
                👁️
              </button>
            </div>
            <div class="error-message" id="confirmPasswordError"></div>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            Create Account
          </button>

          <div class="login-link">
            Already have an account? <a href="login.html">Sign in</a>
          </div>
        </form>
      </div>
    </div>

    <script src="../../js/user/register.js" type="module"></script>
    <script src="../../js/user/alert.js" type="module"></script>
  </body>
</html>
