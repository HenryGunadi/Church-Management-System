<section>
  <div class="container">
    <!-- Left Image / Info Section -->
    <div class="image-section">
      <div class="image-content">
        <a href="#/" class="logo">✟</a>
        <h1>Welcome to Our Faith Community</h1>
        <p>
          Join us in worship, fellowship, and spiritual growth. Create your
          account to connect with our church family and stay updated with events
          and services.
        </p>
      </div>
    </div>

    <!-- Register Form Section -->
    <div class="form-section">
      <div class="form-header">
        <h2>Create Account</h2>
        <p>Fill in your details to get started</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="your.email@example.com"
            required
          />
          <div class="error-message" id="emailError"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a strong password"
              required
            />
            <button type="button" class="eye-toggle" id="togglePassword">
              👁️
            </button>
          </div>

          <div class="password-strength">
            <div class="password-strength-bar" id="strengthBar"></div>
          </div>

          <div class="error-message" id="passwordError"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Re-enter your password"
              required
            />
            <button type="button" class="eye-toggle" id="toggleConfirmPassword">
              👁️
            </button>
          </div>
          <div class="error-message" id="confirmPasswordError"></div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          Create Account
        </button>

        <div class="login-link">
          Already have an account?
          <a href="/login">Sign in</a>
        </div>
      </form>
    </div>
  </div>
</section>
