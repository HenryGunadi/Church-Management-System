<section>
  <div class="container">
    <div class="header">
      <div class="header-icon">✝️</div>
      <h1>Profil Jemaat</h1>
      <p>Kelola informasi profil Anda di sistem gereja</p>
    </div>

    <div class="profile-section">
      <div id="message" class="message"></div>

      <!-- Photo Section -->
      <div class="profile-photo-container">
        <div class="photo-wrapper">
          <img
            id="profilePhoto"
            src="https://ui-avatars.com/api/?name=Nama+Jemaat&size=160&background=ff6b35&color=fff"
            alt="Foto Profil"
            class="profile-photo"
          />
          <div
            class="photo-overlay"
            onclick="document.getElementById('photoInput').click()"
          >
            <span>📷</span>
            <small>Ganti Foto</small>
          </div>
        </div>
        <input
          type="file"
          id="photoInput"
          class="file-input"
          accept="image/*"
        />
        <button
          class="btn-change-photo"
          onclick="document.getElementById('photoInput').click()"
        >
          📸 Pilih Foto Profil
        </button>
      </div>

      <div class="info-box">
        ℹ️ Klik tombol "Edit Profil" untuk mengubah informasi Anda. Jangan lupa
        simpan perubahan setelah selesai.
      </div>

      <!-- Personal Info Card -->
      <div class="card">
        <h2 class="section-title">📋 Informasi Pribadi</h2>
        <form id="personalForm">
          <div class="form-group">
            <label for="name">Nama Lengkap <span>*</span></label>
            <input type="text" id="fullName" value="Nama Jemaat" disabled />
          </div>

          <div class="form-group">
            <label for="email">Email <span>*</span></label>
            <input type="email" id="email" value="jemaat@gereja.com" disabled />
          </div>

          <div class="form-actions">
            <button
              type="button"
              class="btn btn-primary"
              id="editBtn"
              onclick="enableEdit()"
            >
              ✏️ Edit Profil
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              id="cancelBtn"
              onclick="cancelEdit()"
              style="display: none"
            >
              ✖️ Batal
            </button>
          </div>
        </form>
      </div>

      <!-- Change Password Section -->
      <div class="password-section">
        <h3>🔒 Ubah Password</h3>
        <form id="passwordForm">
          <div class="form-group">
            <label for="currentPassword"
              >Password Saat Ini <span>*</span></label
            >
            <input
              type="password"
              id="currentPassword"
              placeholder="Masukkan password saat ini"
            />
          </div>

          <div class="form-group">
            <label for="newPassword">Password Baru <span>*</span></label>
            <input
              type="password"
              id="newPassword"
              placeholder="Minimal 6 karakter"
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword"
              >Konfirmasi Password Baru <span>*</span></label
            >
            <input
              type="password"
              id="confirmPassword"
              placeholder="Ulangi password baru"
            />
          </div>
        </form>
      </div>

      <button class="btn-save" onclick="saveChanges()">
        💾 Simpan Semua Perubahan
      </button>
    </div>
  </div>

  <script src="../../js/user/userProfile.js" type="module"></script>
</section>
