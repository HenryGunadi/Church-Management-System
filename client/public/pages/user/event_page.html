<section class="event-page">
  <!-- Navbar placeholder -->
  <div id="userNavbar"></div>

  <!-- Hero Section with Waves -->
  <div class="hero-section">
    <div class="hero-content">
      <h1>Upcoming Events</h1>
      <p>Join us in fellowship, worship, and community gatherings</p>
    </div>
    <svg
      class="wave-divider"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 1440 320"
      preserveAspectRatio="none"
    >
      <path
        fill="#ffffff"
        fill-opacity="1"
        d="M0,96L48,112C96,128,192,160,288,165.3C384,171,480,149,576,133.3C672,117,768,107,864,122.7C960,139,1056,181,1152,186.7C1248,192,1344,160,1392,144L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"
      ></path>
    </svg>
  </div>

  <!-- Events Container -->
  <div class="events-wrapper">
    <div class="events-container"></div>
  </div>

  <!-- Event Modal -->
  <div id="eventModal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <button class="modal-close" aria-label="Close modal">×</button>

      <div class="modal-header">
        <div class="modal-image" id="modalImage"></div>
      </div>

      <div class="modal-body">
        <div class="modal-badge" id="modalEventType"></div>
        <h2 class="modal-title" id="modalEventName"></h2>

        <div class="modal-info-grid">
          <div class="info-card">
            <div class="info-icon">📅</div>
            <div class="info-text">
              <span class="info-label">Date</span>
              <span class="info-value" id="modalDate"></span>
            </div>
          </div>

          <div class="info-card">
            <div class="info-icon">🕐</div>
            <div class="info-text">
              <span class="info-label">Time</span>
              <span class="info-value" id="modalTime"></span>
            </div>
          </div>

          <div class="info-card">
            <div class="info-icon">📍</div>
            <div class="info-text">
              <span class="info-label">Location</span>
              <span class="info-value" id="modalPlace"></span>
            </div>
          </div>

          <div class="info-card" id="modalSpeakerRow" style="display: none">
            <div class="info-icon">🎤</div>
            <div class="info-text">
              <span class="info-label">Speaker</span>
              <span class="info-value" id="modalSpeaker"></span>
            </div>
          </div>

          <div class="info-card" id="modalTopicRow" style="display: none">
            <div class="info-icon">📖</div>
            <div class="info-text">
              <span class="info-label">Topic</span>
              <span class="info-value" id="modalTopic"></span>
            </div>
          </div>
        </div>

        <div class="modal-description">
          <h3>About This Event</h3>
          <p id="modalDescription"></p>
        </div>

        <button class="btn-register" id="registerBtn">Register Now</button>
      </div>
    </div>
  </div>

  <!-- Footer placeholder -->
  <div id="userFooter"></div>
</section>
