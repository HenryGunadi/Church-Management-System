<section>
  <div id="userNavbar"></div>

  <div class="page-header">
    <h1>Upcoming Events</h1>
    <p>Join us for inspiring gatherings and meaningful connections</p>
  </div>

  <div class="events-container"></div>

  <!-- Event Modal -->
  <div id="eventModal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <button class="modal-close">&times;</button>

      <div class="modal-body">
        <div class="modal-image" id="modalImage"></div>

        <div class="modal-details">
          <div class="modal-type" id="modalEventType"></div>
          <h2 class="modal-title" id="modalEventName"></h2>

          <div class="modal-info">
            <div class="info-row">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path
                  d="M16 3H4C2.9 3 2 3.9 2 5V17C2 18.1 2.9 19 4 19H16C17.1 19 18 18.1 18 17V5C18 3.9 17.1 3 16 3Z"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="M14 1V5M6 1V5M2 8H18"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
              </svg>
              <div>
                <span class="info-label">Date</span>
                <span class="info-value" id="modalDate"></span>
              </div>
            </div>

            <div class="info-row">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <circle
                  cx="10"
                  cy="10"
                  r="8"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="M10 5V10L13 12"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
              </svg>
              <div>
                <span class="info-label">Time</span>
                <span class="info-value" id="modalTime"></span>
              </div>
            </div>

            <div class="info-row">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path
                  d="M10 18C10 18 17 13 17 7.5C17 4.5 14.5 2 11.5 2C8.5 2 6 4.5 6 7.5C6 13 10 18 10 18Z"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <circle cx="10" cy="7.5" r="2" fill="currentColor" />
              </svg>
              <div>
                <span class="info-label">Location</span>
                <span class="info-value" id="modalPlace"></span>
              </div>
            </div>

            <div class="info-row" id="modalSpeakerRow" style="display: none">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path
                  d="M10 11C12.2091 11 14 9.20914 14 7C14 4.79086 12.2091 3 10 3C7.79086 3 6 4.79086 6 7C6 9.20914 7.79086 11 10 11Z"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="M4 17C4 14.2386 6.23858 12 9 12H11C13.7614 12 16 14.2386 16 17"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
              </svg>
              <div>
                <span class="info-label">Speaker</span>
                <span class="info-value" id="modalSpeaker"></span>
              </div>
            </div>

            <div class="info-row" id="modalTopicRow" style="display: none">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path
                  d="M4 4H16V16H4V4Z"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="M7 7H13M7 10H13M7 13H10"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
              </svg>
              <div>
                <span class="info-label">Topic</span>
                <span class="info-value" id="modalTopic"></span>
              </div>
            </div>
          </div>

          <div class="modal-description">
            <h3>About this event</h3>
            <p id="modalDescription"></p>
          </div>

          <button class="btn-register" id="registerBtn">Register Now</button>
        </div>
      </div>
    </div>
  </div>

  <div id="userFooter"></div>
</section>
