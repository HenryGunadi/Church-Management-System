<section class="profile-page"></section>
<div id="userNavbar"></div>
  <div class="container">
      <div class="header">
          <div class="header-icon">✝️</div>
          <h1>Profil Jemaat</h1>
          <p>Kelola informasi profil Anda di sistem gereja</p>
      </div>

      <div class="profile-section">
          <div id="message" class="message"></div>

          <!-- Profile Avatar Section (No Upload) -->
          <div class="profile-photo-container">
              <div class="photo-wrapper">
                  <div class="user-avatar-large" id="userAvatarLarge">U</div>
              </div>
              <h2 id="displayName">Loading...</h2>
              <p id="displayEmail">Loading...</p>
          </div>

          <div class="info-box">
              <i class="fas fa-info-circle"></i> Klik tombol "Edit Profil" untuk mengubah informasi Anda. Jangan lupa simpan perubahan setelah selesai.
          </div>

          <!-- Personal Info Card -->
          <div class="card">
              <h2 class="section-title">
                  <i class="fas fa-user"></i> Informasi Pribadi
              </h2>
              <form id="personalForm">
                  <div class="form-group">
                      <label for="fullName">Nama Lengkap <span>*</span></label>
                      <input type="text" id="fullName" placeholder="Masukkan nama lengkap" disabled required />
                  </div>

                  <div class="form-group">
                      <label for="email">Email <span>*</span></label>
                      <input type="email" id="email" placeholder="Masukkan email" disabled required />
                  </div>
                  <div class="form-group">
                    <label for="gender">Jenis Kelamin <span>*</span></label>
                    <div class="gender-options">
                      <label class="gender-option">
                        <input type="radio" name="gender" id="genderMale" value="male" disabled />
                        <span>Laki-laki</span>
                      </label>
                      <label class="gender-option">
                        <input type="radio" name="gender" id="genderFemale" value="female" disabled />
                        <span>Perempuan</span>
                      </label>
                    </div>
                  </div>
                  <div class="form-group">
                      <label for="phone">Nomor Telepon</label>
                      <input type="tel" id="phone" placeholder="08xxx-xxxx-xxxx" disabled />
                  </div>

                  <div class="form-group">
                      <label for="address">Alamat</label>
                      <textarea id="address" rows="3" placeholder="Masukkan alamat lengkap" disabled></textarea>
                  </div>

                  <div class="form-actions">
                      <button type="button" class="btn btn-primary" id="editBtn">
                          <i class="fas fa-edit"></i> Edit Profil
                      </button>
                      <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none">
                          <i class="fas fa-times"></i> Batal
                      </button>
                  </div>
              </form>
          </div>

          <!-- Change Password Section -->
          <div class="password-section">
              <h3><i class="fas fa-lock"></i> Ubah Password</h3>
              <form id="passwordForm">
                  <div class="form-group">
                      <label for="currentPassword">Password Saat Ini <span>*</span></label>
                      <input type="password" id="currentPassword" placeholder="Masukkan password saat ini" />
                  </div>

                  <div class="form-group">
                      <label for="newPassword">Password Baru <span>*</span></label>
                      <input type="password" id="newPassword" placeholder="Minimal 6 karakter" />
                  </div>

                  <div class="form-group">
                      <label for="confirmPassword">Konfirmasi Password Baru <span>*</span></label>
                      <input type="password" id="confirmPassword" placeholder="Ulangi password baru" />
                  </div>
              </form>
          </div>

          <button class="btn-save" id="saveBtn">
              <i class="fas fa-save"></i> Simpan Semua Perubahan
          </button>
      </div>
  </div>
</section>
